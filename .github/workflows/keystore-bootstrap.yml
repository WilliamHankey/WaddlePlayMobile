name: Bootstrap release keystore

# Run this ONCE. It generates an Android release keystore in CI and prints the
# four values you need to add as repository secrets. The keystore cannot be
# recovered afterwards, so keep the values in a password manager.
#
# This exists because the release key must be the same for every build; losing
# it means the app can no longer be updated in place.

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: "Password for the keystore and key"
        required: true
        default: "replace-this-with-a-long-random-password"
        type: string

jobs:
  generate:
    name: Generate keystore
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        id: key
        env:
          PW: ${{ inputs.store_password }}
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass "$PW" -keypass "$PW" \
            -alias waddleplay \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=WaddlePlay, OU=Mobile, O=WaddlePlay, L=Cape Town, C=ZA"
          {
            echo "alias=waddleplay"
            echo "password=$PW"
            echo "base64=$(base64 -w0 release.keystore)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish values to the run summary
        env:
          BASE64: ${{ steps.key.outputs.base64 }}
          PASSWORD: ${{ steps.key.outputs.password }}
          ALIAS: ${{ steps.key.outputs.alias }}
        run: |
          {
            echo "### Keystore generated"
            echo
            echo "Add these as repository secrets (Settings > Secrets and variables > Actions > Secrets):"
            echo
            echo '```'
            echo "ANDROID_KEYSTORE_BASE64 = $BASE64"
            echo "ANDROID_STORE_PASSWORD = $PASSWORD"
            echo "ANDROID_KEY_ALIAS     = $ALIAS"
            echo "ANDROID_KEY_PASSWORD  = $PASSWORD"
            echo '```'
            echo
            echo "These values are not recoverable after this run. Store them now."
          } >> "$GITHUB_STEP_SUMMARY"
